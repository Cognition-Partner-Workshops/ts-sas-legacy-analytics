[project]
name = "sas-transforms"
version = "0.1.0"
description = "SAS macro translations to Python/pandas"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
spss = [
    "pyreadstat>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
